<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Seatwork 1</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    
    <style>
    .container {
            background-color: seagreen;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
            justify-content: center;
    }
    body {
        justify-content: center;
        display: flex;
    }

    h1 {
        color: burlywood
    }
    </style>
</head>
<body>
    <div class="container">
    <h1>About Me!</h1>
    <br>
    <div id="div1"></div>
      <h1>My calculator</h1>
        <input type="number" id="n1" placeholder="Insert number"><br><br>
        <input type="number" id="n2" placeholder="Insert number"><br><br>
        <div class="buttons">
        <button py-click="add">+</button>
        <button py-click="subtract">−</button>
        <button py-click="multiply">×</button>
        <button py-click="divide">÷</button>
        </div>
        <div type="number" id="Result" placeholder="Result"></div><br><br>
</div>
    <script type="py" src="main.py"></script>
    
    
</body>
</html>
